name: Fuzz

# Continuous fuzz — the long-running counterpart to the per-PR test suite.
#
# tests/Wolfgang.Extensions.Mail.Tests.Fuzz asserts invariants over generated messages, addresses
# and raw text (round trips, never-throw guarantees); FUZZ_ITERATIONS and FUZZ_TIME_SECONDS decide
# how hard, and FUZZ_SEED replays one reported case. The per-PR run uses the project's small
# defaults so a pull request is not held up; this workflow runs 100,000 cases per property with a
# five-minute budget each, weekly, to reach inputs a short pass never generates.
#
# On a finding it files ONE issue and comments on it thereafter, rather than filing a new issue per
# run. That is deliberate: a detector that opens a duplicate every week gets muted, and one that
# silently does nothing when an issue is already open stops being a detector at all. The comment is
# the middle path - a recurring finding stays visible on the existing thread.

on:
  schedule:
    # Mondays, early UTC. Off the hour to avoid the top-of-hour scheduling crush.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      iterations:
        description: Cases to run per property
        required: false
        default: '100000'
      time_seconds:
        description: Per-property time budget in seconds (1-300) - a floor, so the run takes this times the number of properties
        required: false
        default: '300'
      seed:
        description: Replay one CsCheck seed from an earlier finding (leave empty for a normal run)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz the public surface
    runs-on: ubuntu-latest
    # CsCheck's time budget is a FLOOR per property, not a ceiling on the run: each property runs
    # for its full budget. Eight properties at the 300-second default is ~40 minutes, so the timeout
    # has to clear that with room for restore and startup. Measured locally: a 20-second budget
    # produced a 2.7-minute run for the eight properties. The time_seconds input is capped at 300
    # below for the same reason; raise the cap and this timeout together.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write   # only to report a finding; see the note above
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the inputs
        # A budget the timeout above cannot cover would be accepted by the dispatch form and then
        # killed mid-run, reporting nothing. Reject it up front instead.
        env:
          ITERATIONS: ${{ inputs.iterations || '100000' }}
          TIME_SECONDS: ${{ inputs.time_seconds || '300' }}
        run: |
          case "$ITERATIONS" in
            ''|*[!0-9]*|0) echo "::error::iterations must be a positive integer, got '$ITERATIONS'."; exit 1 ;;
          esac

          case "$TIME_SECONDS" in
            ''|*[!0-9]*|0) echo "::error::time_seconds must be a positive integer, got '$TIME_SECONDS'."; exit 1 ;;
          esac

          if [ "$TIME_SECONDS" -gt 300 ]; then
            echo "::error::time_seconds is capped at 300: eight properties at 300 s is ~40 minutes against the job's 75-minute timeout. Raise timeout-minutes with the cap."
            exit 1
          fi

      - name: Detect the fuzz project
        id: detect
        run: |
          if [ -d tests/Wolfgang.Extensions.Mail.Tests.Fuzz ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No fuzz project - nothing to run."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run the properties
        id: fuzz
        if: steps.detect.outputs.found == 'true'
        # The output goes to a file rather than through a pipe: the default `run:` shell is
        # `bash -e` WITHOUT pipefail, so `dotnet test | tee` would report tee's exit code and a
        # failing run would look green.
        env:
          FUZZ_ITERATIONS: ${{ inputs.iterations || '100000' }}
          FUZZ_TIME_SECONDS: ${{ inputs.time_seconds || '300' }}
          FUZZ_SEED: ${{ inputs.seed || '' }}
        #
        # Only a failed TEST is a finding. `dotnet test`'s exit code alone cannot say that: it is
        # non-zero for a restore, build or adapter failure too (which would file an issue with no
        # counterexample in it), and it is 0 when no tests were discovered at all. So the verdict
        # comes from the TRX counters, and anything else fails the run without reporting.
        run: |
          mkdir -p fuzz-results
          echo "FUZZ_ITERATIONS=$FUZZ_ITERATIONS FUZZ_TIME_SECONDS=$FUZZ_TIME_SECONDS FUZZ_SEED=${FUZZ_SEED:-<none>}"

          status=0
          dotnet test tests/Wolfgang.Extensions.Mail.Tests.Fuzz/Wolfgang.Extensions.Mail.Tests.Fuzz.csproj \
              --configuration Release \
              --logger "trx;LogFileName=fuzz.trx" \
              --results-directory fuzz-results \
              > fuzz-results/fuzz.log 2>&1 || status=$?

          cat fuzz-results/fuzz.log

          counters=""
          if [ -f fuzz-results/fuzz.trx ]; then
            counters=$(grep -o '<Counters [^>]*>' fuzz-results/fuzz.trx | head -n 1 || true)
          fi

          if [ -z "$counters" ]; then
            echo "::error::dotnet test exited $status and wrote no TRX counters - a restore/build/adapter failure, not a fuzz finding."
            exit 1
          fi

          executed=$(echo "$counters" | sed -n 's/.* executed="\([0-9]*\)".*/\1/p')
          failed=$(echo "$counters" | sed -n 's/.* failed="\([0-9]*\)".*/\1/p')
          echo "TRX: executed=${executed:-?} failed=${failed:-?} (dotnet test exit $status)"

          if [ "${executed:-0}" -eq 0 ]; then
            echo "::error::No fuzz property ran - the test adapter found nothing to execute. dotnet test exits 0 in this case, so this step fails instead."
            exit 1
          fi

          if [ "${failed:-0}" -gt 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            echo "::error::dotnet test exited $status with no failed test - an infrastructure failure, not a fuzz finding."
            exit 1
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the run's output
        # Uploaded whether or not it failed: CsCheck prints the shrunk counterexample AND the seed
        # that reproduces it, which is the only durable record of a finding once the runner is gone.
        if: always() && steps.detect.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-results
          path: fuzz-results/
          retention-days: 90
          if-no-files-found: error

      - name: Report a finding
        # always(): a failed artifact upload above must not skip the report of a real finding.
        if: always() && steps.fuzz.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ITERATIONS: ${{ inputs.iterations || '100000' }}
        run: |
          # The failing property, its shrunk counterexample and its seed are all in the tail of the
          # log. Keep it short enough to read in a notification and point at the artifact for the rest.
          tail -n 60 fuzz-results/fuzz.log > finding.txt

          # Every line with a backtick is DOUBLE-quoted with the backtick escaped, and the log is
          # indented into a Markdown code block rather than fenced. Backticks inside a single-quoted
          # echo argument are an expansion that will never happen as far as shellcheck is concerned
          # (SC2016), and actionlint fails the run on it. A heredoc would read better but its body
          # cannot be indented inside a YAML block scalar without becoming part of the Markdown.
          {
            echo "A fuzz property failed on the scheduled run."
            echo
            echo "- Run: $RUN_URL"
            echo "- Cases per property: $ITERATIONS"
            echo "- Full log and TRX: the \`fuzz-results\` artifact on that run."
            echo
            echo "CsCheck reports the shrunk counterexample and the seed that reproduces it. To"
            echo "replay it deterministically, run this workflow by hand with that seed, or locally:"
            echo "\`FUZZ_SEED=<the seed from the log> dotnet test tests/Wolfgang.Extensions.Mail.Tests.Fuzz\`. Once the case is understood,"
            echo "keep it as a named unit test - a regression test beats a rerun of the fuzzer."
            echo
            echo "Last 60 lines of the log:"
            echo
            sed 's/^/    /' finding.txt
          } > body.md

          # One thread per finding. `--search` matches the title marker below, so this does not
          # depend on a label existing in the repository.
          existing=$(gh issue list --state open --search 'in:title "Fuzz finding"' --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Commenting on the open finding #$existing rather than filing a duplicate."
            gh issue comment "$existing" --body-file body.md
          else
            # The label may not exist yet; --force makes this a no-op when it does, so the
            # create below cannot fail on a missing label.
            gh label create "kind:fuzz-finding" --color B60205 --description "A scheduled fuzz run found a failing property" --force
            gh issue create \
              --title "Fuzz finding: a property failed on the scheduled run" \
              --label bug \
              --label "kind:fuzz-finding" \
              --body-file body.md
          fi

      - name: Fail the run when a property failed
        # Separate from the report step so that a reporting problem - a rate limit, a missing label -
        # cannot swallow the finding itself.
        if: always() && steps.fuzz.outputs.failed == 'true'
        run: |
          echo "::error::A fuzz property failed. See the fuzz-results artifact and the filed issue."
          exit 1
