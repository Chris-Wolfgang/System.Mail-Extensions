# zizmor configuration — accepted, documented suppressions.
# https://docs.zizmor.sh/configuration/
#
# Each entry records a finding that is a deliberate, reviewed design choice
# rather than a defect. Everything else is expected to pass; the CI gate
# (the zizmor job in actions-audit.yaml) fails on any high-severity finding.
#
# pr.yaml runs on `pull_request` (see docs/WORKFLOW_SECURITY.md), so it no
# longer needs a dangerous-triggers entry. The one `pull_request_target`
# workflow, protected-files.yaml, never checks out PR code and carries an
# inline `# zizmor: ignore[dangerous-triggers]` on its trigger instead.
rules:
  superfluous-actions:
    ignore:
      # release.yaml uses softprops/action-gh-release to attach NuGet packages,
      # symbol packages, SBOM JSON, and the coverage zip to the release. zizmor
      # suggests replacing it with `gh release` script steps, but the action
      # gives us tag-aware upload, glob matching across multiple file patterns,
      # and idempotent re-upload on release re-publish that a hand-rolled
      # `gh release` loop would have to reimplement. Fleet convention (see
      # `reference_release_pipeline_multipackage`) uses this action across
      # every releasable repo.
      - release.yaml
